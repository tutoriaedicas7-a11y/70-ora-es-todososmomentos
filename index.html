<!DOCTYPE html>
<html lang="pt-BR">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1.0, user-scalable=no" />
  <title>70 Orações Poderosas — Comunhão Diária com Deus</title>

  <!-- Metatags para prévia com imagem e texto no WhatsApp / Redes Sociais -->
  <meta property="og:type" content="website" />
  <meta property="og:title" content="70 Orações Poderosas — Comunhão Diária com Deus" />
  <meta property="og:description" content="Ouça e pratique orações diárias com narração em voz serena e fundo musical instrumental de adoração. Experimente grátis!" />
  <meta property="og:image" content="https://images.unsplash.com/photo-1507692049790-de58290a4334?w=1200&auto=format&fit=crop&q=80" />
  <meta property="og:image:width" content="1200" />
  <meta property="og:image:height" content="630" />
  <meta name="theme-color" content="#1e1b4b" />

  <!-- Estilos e Fontes -->
  <link rel="preconnect" href="https://fonts.googleapis.com">
  <link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
  <link href="https://fonts.googleapis.com/css2?family=Cinzel:wght@500;700&family=Plus+Jakarta+Sans:wght@400;500;600;700&display=swap" rel="stylesheet">

  <style>
    :root {
      --bg: #0b0f19;
      --card-bg: rgba(26, 32, 53, 0.85);
      --card-border: rgba(212, 175, 55, 0.25);
      --gold-primary: #d4af37;
      --gold-light: #fef3c7;
      --text-main: #f8fafc;
      --text-muted: #94a3b8;
      --primary-accent: #4338ca;
      --vip-badge: #eab308;
    }

    * {
      box-sizing: border-box;
      margin: 0;
      padding: 0;
      -webkit-tap-highlight-color: transparent;
      user-select: none;
    }

    body {
      font-family: 'Plus Jakarta Sans', sans-serif;
      background: radial-gradient(circle at top, #1e1b4b 0%, #0b0f19 100%);
      color: var(--text-main);
      min-height: 100vh;
      display: flex;
      flex-direction: column;
      padding-bottom: 90px;
    }

    header {
      padding: 24px 20px 16px;
      text-align: center;
      background: rgba(11, 15, 25, 0.9);
      backdrop-filter: blur(10px);
      position: sticky;
      top: 0;
      z-index: 40;
      border-bottom: 1px solid rgba(212, 175, 55, 0.2);
    }

    header h1 {
      font-family: 'Cinzel', serif;
      font-size: 1.45rem;
      color: var(--gold-primary);
      letter-spacing: 0.5px;
      margin-bottom: 4px;
    }

    header p {
      font-size: 0.85rem;
      color: var(--text-muted);
    }

    .badge-status {
      display: inline-flex;
      align-items: center;
      gap: 6px;
      padding: 4px 12px;
      border-radius: 999px;
      font-size: 0.75rem;
      font-weight: 600;
      margin-top: 8px;
    }

    .badge-free {
      background: rgba(148, 163, 184, 0.15);
      color: #cbd5e1;
      border: 1px solid rgba(148, 163, 184, 0.3);
    }

    .badge-vip {
      background: rgba(234, 179, 8, 0.18);
      color: #fde047;
      border: 1px solid #eab308;
    }

    /* Categorias */
    .filter-bar {
      display: flex;
      gap: 8px;
      overflow-x: auto;
      padding: 12px 20px;
      scrollbar-width: none;
    }
    .filter-bar::-webkit-scrollbar { display: none; }

    .filter-btn {
      white-space: nowrap;
      background: rgba(255, 255, 255, 0.05);
      border: 1px solid rgba(255, 255, 255, 0.1);
      color: var(--text-muted);
      padding: 7px 14px;
      border-radius: 20px;
      font-size: 0.8rem;
      cursor: pointer;
      transition: all 0.2s;
    }

    .filter-btn.active {
      background: var(--gold-primary);
      color: #0b0f19;
      font-weight: 700;
      border-color: var(--gold-primary);
    }

    /* Lista de Orações */
    .container {
      max-width: 600px;
      width: 100%;
      margin: 0 auto;
      padding: 8px 16px;
      display: flex;
      flex-direction: column;
      gap: 12px;
    }

    .card {
      background: var(--card-bg);
      border: 1px solid var(--card-border);
      border-radius: 14px;
      padding: 16px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      cursor: pointer;
      transition: transform 0.15s, border-color 0.2s;
    }

    .card:active {
      transform: scale(0.98);
    }

    .card-left {
      display: flex;
      align-items: center;
      gap: 14px;
      flex: 1;
      min-width: 0;
    }

    .card-number {
      width: 38px;
      height: 38px;
      border-radius: 10px;
      background: rgba(212, 175, 55, 0.12);
      color: var(--gold-primary);
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: 700;
      font-size: 0.9rem;
      flex-shrink: 0;
    }

    .card-info h3 {
      font-size: 0.98rem;
      font-weight: 600;
      color: #fff;
      margin-bottom: 2px;
      white-space: nowrap;
      overflow: hidden;
      text-overflow: ellipsis;
    }

    .card-info span {
      font-size: 0.75rem;
      color: var(--text-muted);
    }

    .card-tag {
      font-size: 0.72rem;
      font-weight: 600;
      padding: 3px 8px;
      border-radius: 6px;
      display: inline-block;
    }

    .tag-free {
      background: rgba(34, 197, 94, 0.15);
      color: #4ade80;
    }

    .tag-locked {
      background: rgba(239, 68, 68, 0.15);
      color: #f87171;
    }

    /* Modal de Leitura / Oração */
    .modal {
      position: fixed;
      inset: 0;
      background: rgba(7, 10, 19, 0.95);
      backdrop-filter: blur(12px);
      z-index: 100;
      display: none;
      flex-direction: column;
      justify-content: space-between;
      padding: 24px 20px;
    }

    .modal.active {
      display: flex;
    }

    .modal-header {
      display: flex;
      justify-content: space-between;
      align-items: center;
      border-bottom: 1px solid rgba(255, 255, 255, 0.1);
      padding-bottom: 12px;
    }

    .modal-header h2 {
      font-family: 'Cinzel', serif;
      font-size: 1.15rem;
      color: var(--gold-primary);
      max-width: 80%;
    }

    .btn-close {
      background: none;
      border: none;
      color: #94a3b8;
      font-size: 1.6rem;
      cursor: pointer;
    }

    .modal-body {
      flex: 1;
      overflow-y: auto;
      padding: 24px 8px;
      font-size: 1.15rem;
      line-height: 1.85;
      color: #f1f5f9;
      text-align: justify;
      user-select: text;
    }

    .modal-body p {
      margin-bottom: 16px;
    }

    .modal-footer {
      background: rgba(26, 32, 53, 0.9);
      border: 1px solid var(--card-border);
      border-radius: 16px;
      padding: 14px 18px;
      display: flex;
      align-items: center;
      justify-content: space-between;
      gap: 12px;
    }

    .audio-controls {
      display: flex;
      align-items: center;
      gap: 12px;
    }

    .btn-play {
      background: var(--gold-primary);
      border: none;
      color: #0b0f19;
      width: 48px;
      height: 48px;
      border-radius: 50%;
      font-size: 1.3rem;
      cursor: pointer;
      display: flex;
      align-items: center;
      justify-content: center;
      font-weight: bold;
    }

    .audio-text {
      font-size: 0.8rem;
      color: var(--text-muted);
    }

    .audio-text b {
      display: block;
      color: #fff;
      font-size: 0.85rem;
    }

    /* Bloqueio VIP / Paywall */
    .paywall-modal {
      position: fixed;
      inset: 0;
      background: rgba(11, 15, 25, 0.98);
      z-index: 110;
      display: none;
      align-items: center;
      justify-content: center;
      padding: 24px;
    }

    .paywall-modal.active {
      display: flex;
    }

    .paywall-card {
      background: radial-gradient(circle at top, #2e1065 0%, #1e1b4b 100%);
      border: 2px solid var(--gold-primary);
      border-radius: 20px;
      padding: 30px 22px;
      max-width: 440px;
      width: 100%;
      text-align: center;
      position: relative;
    }

    .paywall-card h2 {
      font-family: 'Cinzel', serif;
      color: var(--gold-primary);
      font-size: 1.4rem;
      margin-bottom: 10px;
    }

    .paywall-card p {
      font-size: 0.92rem;
      color: #e2e8f0;
      line-height: 1.5;
      margin-bottom: 18px;
    }

    .price-box {
      background: rgba(0, 0, 0, 0.35);
      border-radius: 12px;
      padding: 14px;
      margin-bottom: 20px;
    }

    .price-box span {
      display: block;
      font-size: 0.8rem;
      color: #cbd5e1;
    }

    .price-box strong {
      font-size: 1.8rem;
      color: #38bdf8;
    }

    .btn-buy {
      display: block;
      width: 100%;
      background: linear-gradient(135deg, #eab308 0%, #ca8a04 100%);
      color: #0b0f19;
      font-weight: 700;
      text-decoration: none;
      padding: 15px;
      border-radius: 12px;
      font-size: 1.05rem;
      text-transform: uppercase;
      letter-spacing: 0.5px;
      box-shadow: 0 4px 15px rgba(234, 179, 8, 0.4);
      margin-bottom: 14px;
    }

    .btn-unlock-key {
      background: transparent;
      border: 1px solid rgba(255, 255, 255, 0.25);
      color: #94a3b8;
      font-size: 0.82rem;
      padding: 8px 14px;
      border-radius: 8px;
      cursor: pointer;
    }

    /* Barra de Navegação Inferior */
    nav.bottom-nav {
      position: fixed;
      bottom: 0;
      left: 0;
      right: 0;
      height: 70px;
      background: rgba(11, 15, 25, 0.95);
      backdrop-filter: blur(12px);
      border-top: 1px solid rgba(212, 175, 55, 0.2);
      display: flex;
      justify-content: space-around;
      align-items: center;
      z-index: 50;
    }

    .nav-item {
      display: flex;
      flex-direction: column;
      align-items: center;
      gap: 4px;
      color: var(--text-muted);
      font-size: 0.75rem;
      cursor: pointer;
      background: none;
      border: none;
    }

    .nav-item.active {
      color: var(--gold-primary);
      font-weight: 600;
    }

    .nav-item svg {
      width: 22px;
      height: 22px;
      fill: currentColor;
    }
  </style>
</head>
<body>

    <h1>70 Orações Poderosas</h1>
    <p>Comunhão Diária com Deus</p>
    <div id="statusBadge" class="badge-status badge-free">Degustação: 7 Orações Liberadas</div>
  </header>
